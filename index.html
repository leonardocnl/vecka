<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Vecka">
<title>Vecka</title>
<link rel="icon" type="image/png" href="icon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
    @font-face {
        font-family: "Space Mono";
        src: url("fonts/space-mono-bold.woff") format("woff");
        font-weight: 700;
        font-style: normal;
    }
    @font-face {
        font-family: "IBM Plex Sans";
        src: url("fonts/ibm-plex-sans-regular.woff") format("woff");
        font-weight: 400;
        font-style: normal;
    }
    @font-face {
        font-family: "IBM Plex Sans";
        src: url("fonts/ibm-plex-sans-bold.woff") format("woff");
        font-weight: 700;
        font-style: normal;
    }
    * {
        box-sizing: border-box;
        -webkit-box-sizing: border-box;
    }

    /* ===== Cores =====
       Tema claro (padrão) e escuro. Sem variáveis CSS para manter
       compatibilidade com navegadores antigos: o tema escuro reescreve as cores.
       Todos os textos têm contraste de pelo menos 4,5:1 com o fundo (WCAG AA). */
    html {
        /* Impede o navegador de "corrigir" a rolagem sozinho quando um dia abre */
        overflow-anchor: none;
    }
    html, body {
        margin: 0;
        padding: 0;
        background-color: #e3e2de;
        color: #1e1e1e;
        font-family: "IBM Plex Sans", Helvetica, Arial, sans-serif;
    }
    body {
        /* Textura de papel: ruído leve sobreposto à cor de fundo */
        background-image: url("paper.png");
        min-height: 100vh;
    }
    /* Espaçamento: escala de 8 em 8 (8, 16, 24, 32, 48) e uma margem
       lateral única de 24px (16px no celular), para tudo alinhar na mesma coluna */
    #app {
        max-width: 720px;
        margin: 0 auto;
        padding-bottom: 96px;
    }

    /* Texto só para leitores de tela (invisível na tela) */
    .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
    }

    /* ===== Foco visível (navegação por teclado) =====
       A segunda regra esconde o contorno quando o foco veio de toque ou clique
       (navegadores antigos ignoram essa regra e mostram sempre, o que é seguro). */
    button:focus {
        outline: 3px solid #cf1020;
        outline-offset: 2px;
    }
    button:focus:not(:focus-visible) {
        outline: none;
    }
    h2:focus {
        outline: none;
    }

    /* ===== Topo ===== */
    .topbar {
        display: table;
        width: 100%;
        padding: 24px 24px 0 24px;
    }
    .brand, .top-actions {
        display: table-cell;
        vertical-align: middle;
    }
    .brand svg {
        display: block;
        width: 132px;
        height: 44px;
        fill: #1e1e1e;
    }
    .top-actions {
        text-align: right;
    }
    .link {
        background: none;
        border: none;
        color: #4f4e4b;
        font-size: 18px;
        padding: 12px 0 12px 16px;
        min-height: 48px;
        min-width: 44px;
        text-decoration: underline;
        font-family: inherit;
    }
    /* Ícones do topo (letra, tema, limpar tela) */
    .icon-btn {
        display: inline-block;
        min-width: 44px;
        min-height: 48px;
        padding: 0;
        margin-left: 4px;
        background: none;
        border: none;
        color: #4f4e4b;
        vertical-align: middle;
        font-family: "Space Mono", "Courier New", monospace;
        font-weight: bold;
        line-height: 1;
    }
    .icon-btn svg {
        width: 24px;
        height: 24px;
        vertical-align: middle;
    }
    .icon-btn.a-sm {
        font-size: 15px;
    }
    .icon-btn.a-lg {
        font-size: 24px;
    }
    .icon-btn:disabled {
        opacity: 0.35;
    }
    /* Flash preto e branco que limpa os "fantasmas" do e-ink */
    .flash {
        position: fixed;
        left: 0;
        top: 0;
        right: 0;
        bottom: 0;
        z-index: 99;
    }
    .link:disabled {
        opacity: 0.35;
        text-decoration: none;
    }
    /* Celular: topo mais compacto para tudo caber numa linha */
    @media (max-width: 480px) {
        .topbar {
            padding: 16px 16px 0 16px;
        }
        .brand svg {
            width: 105px;
            height: 35px;
        }
        .link {
            font-size: 16px;
            padding: 12px 0 12px 12px;
            min-width: 36px;
        }
    }
    .status {
        padding: 8px 24px 0 24px;
        font-size: 16px;
        color: #4f4e4b;
    }
    .status.error {
        color: #fff;
        font-weight: bold;
    }
    .status.error span {
        display: inline-block;
        padding: 4px 8px;
        background: #cf1020;
    }

    /* ===== Dias ===== */
    .day {
        border-bottom: 1px solid #a8a7a3;
        padding: 0 24px;
    }
    .day-title {
        margin: 0;
        font-size: inherit;
    }
    .day-head {
        display: block;
        width: 100%;
        margin: 0;
        background: none;
        border: none;
        text-align: left;
        padding: 24px 0;
        font-family: "Space Mono", "Courier New", monospace;
        font-size: 44px;
        font-weight: bold;
        /* Dias recolhidos ficam mais apagados: o dia aberto fica "em foco" */
        color: #5c5b58;
    }
    .open .day-head {
        padding: 32px 0 8px 0;
        font-size: 52px;
        color: #1e1e1e;
    }
    .count {
        border: 2px solid currentColor;
        padding: 0 6px;
    }
    .count, .tag, .dd {
        font-family: "IBM Plex Sans", Helvetica, Arial, sans-serif;
        font-size: 20px;
        font-weight: normal;
        color: #4f4e4b;
        letter-spacing: 0;
        margin-left: 16px;
    }
    .date {
        color: #4f4e4b;
        font-size: 20px;
        margin-bottom: 16px;
    }
    .empty {
        margin: 8px 0;
        font-size: 20px;
        color: #4f4e4b;
    }

    /* ===== Tarefas ===== */
    .task {
        display: table;
        width: 100%;
        min-height: 52px;
    }
    .task-cell, .task-actions {
        display: table-cell;
        vertical-align: middle;
    }
    .task-main {
        display: block;
        width: 100%;
        background: none;
        border: none;
        text-align: left;
        padding: 12px 0;
        font-family: inherit;
        font-size: 22px;
        color: inherit;
        line-height: 1.3;
    }
    .task-actions {
        width: 1%;
        white-space: nowrap;
    }
    .temp {
        opacity: 0.6;
    }
    .box {
        position: relative;
        display: inline-block;
        width: 26px;
        height: 26px;
        border: 2px solid #1e1e1e;
        margin-right: 12px;
        vertical-align: -4px;
        text-align: center;
        line-height: 22px;
        font-size: 18px;
        font-weight: bold;
    }
    /* Tarefa feita: um ✕ vermelho "de caneta" dentro da caixa, desenhado
       com dois traços levemente desiguais, como feito à mão */
    .done .box:before, .done .box:after {
        content: "";
        position: absolute;
        left: -2px;
        top: 9px;
        width: 26px;
        height: 4px;
        border-radius: 2px;
        background: #cf1020;
    }
    .done .box:before {
        -webkit-transform: rotate(47deg);
        transform: rotate(47deg);
    }
    .done .box:after {
        top: 10px;
        width: 25px;
        -webkit-transform: rotate(-44deg);
        transform: rotate(-44deg);
    }
    .done .label {
        text-decoration: line-through;
        -webkit-text-decoration-color: #cf1020;
        text-decoration-color: #cf1020;
        color: #575653;
    }
    .rec {
        color: #4f4e4b;
        font-size: 18px;
        margin-left: 6px;
    }
    .small {
        background: none;
        border: none;
        color: #4f4e4b;
        font-size: 17px;
        min-width: 48px;
        min-height: 48px;
        font-family: inherit;
    }
    .more {
        font-size: 22px;
        letter-spacing: 1px;
    }
    /* Ícone de nota ao lado do texto da tarefa */
    .note-ic {
        display: inline-block;
        margin-left: 8px;
        color: #4f4e4b;
        vertical-align: -2px;
    }
    .note-ic svg {
        width: 16px;
        height: 16px;
    }
    /* Painel que abre no "…": nota e ações */
    .task-panel {
        padding: 0 0 16px 38px;
    }
    .task-note {
        margin: 0 0 8px 0;
        font-size: 18px;
        line-height: 1.4;
        color: #4f4e4b;
        white-space: pre-wrap;
        word-wrap: break-word;
    }
    .btn.sm {
        min-height: 44px;
        padding: 0 16px;
        margin-top: 8px;
        font-size: 17px;
    }
    .btn.sq {
        min-width: 44px;
        padding: 0;
        font-size: 20px;
    }

    /* Horário alinhado à direita, como numa agenda */
    .task-time {
        display: table-cell;
        vertical-align: middle;
        width: 1%;
        white-space: nowrap;
        padding-left: 16px;
        font-family: "Space Mono", "Courier New", monospace;
        font-size: 18px;
        font-weight: bold;
        color: #4f4e4b;
    }
    /* Horário que já passou, hoje, numa tarefa não feita */
    .task-time.late span {
        padding: 2px 6px;
        background: #cf1020;
        color: #fff;
    }
    .done .task-time {
        font-weight: normal;
    }

    /* ===== Formulários ===== */
    .add {
        margin: 16px 0 32px 0;
    }
    .add input[type=text], .edit input[type=text] {
        width: 100%;
        border: none;
        border-bottom: 2px solid #8e8d89;
        font-size: 22px;
        padding: 12px 0;
        font-family: inherit;
        background: transparent;
        color: #1e1e1e;
        border-radius: 0;
        outline: none;
        -webkit-appearance: none;
    }
    /* Seletor de horário em grade: hora e depois minutos, dois toques */
    .tp {
        margin-top: 8px;
    }
    .tp-grid {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
    }
    .tp-grid td {
        padding: 0 8px 8px 0;
    }
    .tp-btn {
        display: block;
        width: 100%;
        height: 48px;
        padding: 0;
        border: 2px solid #1e1e1e;
        background: transparent;
        color: #1e1e1e;
        font-family: "Space Mono", "Courier New", monospace;
        font-size: 18px;
        font-weight: bold;
    }
    .tp-btn.on {
        background: #1e1e1e;
        color: #e3e2de;
    }
    .tp-night {
        padding-left: 0;
    }
    .tp-result {
        margin-top: 8px;
        font-size: 20px;
    }
    .tp-result strong {
        font-family: "Space Mono", "Courier New", monospace;
    }
    .edit textarea {
        display: block;
        width: 100%;
        min-height: 88px;
        border: 2px solid #8e8d89;
        padding: 8px;
        font-size: 18px;
        line-height: 1.4;
        font-family: inherit;
        background: transparent;
        color: #1e1e1e;
        border-radius: 0;
        outline: none;
        resize: vertical;
        -webkit-appearance: none;
    }
    .edit textarea:focus {
        border-color: #cf1020;
    }
    .add input[type=text]:focus, .edit input[type=text]:focus {
        border-bottom-color: #cf1020;
    }
    /* Uma regra por navegador: se ficassem juntas, um navegador que não
       entende uma delas ignoraria todas */
    input::-webkit-input-placeholder {
        color: #5c5b58;
    }
    input::-moz-placeholder {
        color: #5c5b58;
        opacity: 1;
    }
    input::placeholder {
        color: #5c5b58;
    }
    .weekdays {
        margin-top: 8px;
    }
    .wd {
        display: inline-block;
        width: 48px;
        height: 48px;
        border: 2px solid #1e1e1e;
        background: transparent;
        color: #1e1e1e;
        font-size: 18px;
        font-weight: bold;
        margin: 0 8px 8px 0;
        font-family: inherit;
    }
    .wd.on {
        background: #1e1e1e;
        color: #e3e2de;
    }
    .hint {
        font-size: 16px;
        color: #4f4e4b;
        margin: 16px 0 8px 0;
    }
    .btn {
        border: 2px solid #1e1e1e;
        background: #1e1e1e;
        color: #e3e2de;
        font-size: 18px;
        padding: 0 24px;
        min-height: 48px;
        margin: 16px 8px 0 0;
        font-family: inherit;
    }
    .btn.alt {
        background: transparent;
        color: #1e1e1e;
    }
    .btn.alt.on {
        background: #1e1e1e;
        color: #e3e2de;
    }
    .edit {
        padding: 8px 0 24px 0;
    }
    .msg {
        padding: 48px 24px;
        font-size: 22px;
    }

    /* ===== Calendário ===== */
    .back-nav {
        padding: 8px 24px 0 24px;
    }
    .back-nav .link {
        padding-left: 0;
    }
    /* A altura de .cal é calculada no JS (tela menos o topo), e o
       conteúdo fica centralizado verticalmente nesse espaço */
    .cal {
        display: table;
        width: 100%;
        padding: 0 24px;
    }
    .cal-center {
        display: table-cell;
        vertical-align: middle;
        padding: 24px 0;
    }
    /* Barra de meses presa ao fundo da tela: não se mexe ao trocar de mês.
       A segunda linha de padding soma a área segura do iPhone (barra de gestos);
       navegadores antigos ignoram e ficam com a primeira. */
    .cal-bar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 16px 24px 32px 24px;
        padding-bottom: calc(32px + env(safe-area-inset-bottom));
        background-color: #e3e2de;
        background-image: url("paper.png");
    }
    .cal-head {
        display: table;
        width: 100%;
        max-width: 672px;
        margin: 0 auto;
    }
    /* Linhas vazias para o mês ter sempre 6 semanas: a grade não muda de altura */
    .cal-pad {
        display: block;
        height: 58px;
    }
    .cal-cell, .cal-title {
        display: table-cell;
        vertical-align: middle;
    }
    .cal-cell {
        width: 56px;
    }
    .cal-cell.right {
        text-align: right;
    }
    .cal-title {
        margin: 0;
        text-align: center;
        font-family: "Space Mono", "Courier New", monospace;
        font-size: 32px;
        font-weight: bold;
        color: #1e1e1e;
    }
    .cal-arrow {
        width: 52px;
        height: 52px;
        background: transparent;
        border: 2px solid #1e1e1e;
        color: #1e1e1e;
        font-size: 28px;
        line-height: 1;
        font-family: inherit;
    }
    .cal-arrow:disabled {
        opacity: 0.25;
    }
    .cal-grid {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
    }
    .cal-grid th {
        padding: 6px 0;
        font-size: 16px;
        font-weight: bold;
        color: #4f4e4b;
        text-align: center;
    }
    .cal-grid abbr {
        text-decoration: none;
        border: none;
    }
    .cal-grid td {
        padding: 2px;
        text-align: center;
    }
    .cal-day {
        display: block;
        width: 100%;
        height: 58px;
        padding: 0;
        background: transparent;
        border: 1px solid #a8a7a3;
        color: #1e1e1e;
        font-family: inherit;
        font-size: 20px;
    }
    .cal-day.today {
        border: 3px solid #1e1e1e;
        font-weight: bold;
    }
    .cal-day:disabled {
        border-color: transparent;
        color: #8e8d89;
    }
    .dot {
        display: block;
        width: 8px;
        height: 8px;
        margin: 3px auto 0 auto;
        border-radius: 4px;
        background: #cf1020;
    }
    @media (max-width: 480px) {
        .cal-title {
            font-size: 22px;
        }
        .cal-day {
            height: 48px;
            font-size: 18px;
        }
        .cal-pad {
            height: 48px;
        }
        .cal-bar {
            padding-left: 16px;
            padding-right: 16px;
        }
    }

    /* ===== Aviso "desfazer" ===== */
    .toast {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        display: none;
        background: #1e1e1e;
        color: #e3e2de;
        padding: 4px 24px;
        font-size: 18px;
    }
    .toast.show {
        display: block;
    }
    .toast-inner {
        display: table;
        width: 100%;
        max-width: 672px;
        margin: 0 auto;
    }
    .toast-text, .toast-act {
        display: table-cell;
        vertical-align: middle;
    }
    .toast-act {
        text-align: right;
        width: 1%;
        white-space: nowrap;
    }
    .toast-btn {
        background: none;
        border: none;
        color: #e3e2de;
        font-size: 18px;
        font-weight: bold;
        text-decoration: underline;
        min-height: 48px;
        padding: 0 0 0 16px;
        font-family: inherit;
    }

    /* ===== Tema escuro ===== */
    html.dark, html.dark body {
        background-color: #2f2f2f;
        color: #e4e3df;
    }
    /* No escuro, um anel claro por fora do contorno vermelho garante que o
       foco seja visível sem mudar o tom do vermelho */
    .dark button:focus {
        outline-color: #cf1020;
        box-shadow: 0 0 0 7px #e4e3df;
    }
    .dark button:focus:not(:focus-visible) {
        outline: none;
        box-shadow: none;
    }
    .dark .brand svg {
        fill: #e4e3df;
    }
    .dark .link, .dark .date, .dark .count, .dark .tag, .dark .rec,
    .dark .small, .dark .hint, .dark .status, .dark .empty {
        color: #b3b2ae;
    }
    .dark .day {
        border-bottom-color: #555;
    }
    .dark .day-head {
        color: #a9a8a4;
    }
    .dark .open .day-head {
        color: #f0efeb;
    }
    .dark .box {
        border-color: #e4e3df;
    }
    .dark .done .label {
        color: #a3a29e;
    }
    .dark .add input[type=text], .dark .edit input[type=text] {
        color: #e4e3df;
        border-bottom-color: #7a7976;
    }
    .dark .add input[type=text]:focus, .dark .edit input[type=text]:focus {
        border-bottom-color: #cf1020;
    }
    .dark input::-webkit-input-placeholder {
        color: #a9a8a4;
    }
    .dark input::-moz-placeholder {
        color: #a9a8a4;
    }
    .dark input::placeholder {
        color: #a9a8a4;
    }
    .dark .wd {
        border-color: #e4e3df;
        color: #e4e3df;
    }
    .dark .wd.on {
        background: #e4e3df;
        color: #2f2f2f;
    }
    .dark .btn {
        border-color: #e4e3df;
        background: #e4e3df;
        color: #2f2f2f;
    }
    .dark .btn.alt {
        background: transparent;
        color: #e4e3df;
    }
    .dark .btn.alt.on {
        background: #e4e3df;
        color: #2f2f2f;
    }
    .dark .toast {
        background: #e4e3df;
        color: #2f2f2f;
    }
    .dark .toast-btn {
        color: #2f2f2f;
    }
    .dark .task-time {
        color: #b3b2ae;
    }
    .dark .icon-btn, .dark .note-ic, .dark .task-note {
        color: #b3b2ae;
    }
    .dark .edit textarea {
        color: #e4e3df;
        border-color: #7a7976;
    }
    .dark .edit textarea:focus {
        border-color: #cf1020;
    }
    .dark .tp-btn {
        border-color: #e4e3df;
        color: #e4e3df;
    }
    .dark .tp-btn.on {
        background: #e4e3df;
        color: #2f2f2f;
    }
    .dark .cal-bar {
        background-color: #2f2f2f;
    }
    .dark .cal-title {
        color: #f0efeb;
    }
    .dark .cal-arrow {
        border-color: #e4e3df;
        color: #e4e3df;
    }
    .dark .cal-grid th {
        color: #b3b2ae;
    }
    .dark .cal-day {
        border-color: #555;
        color: #e4e3df;
    }
    .dark .cal-day.today {
        border-color: #e4e3df;
    }
    .dark .cal-day:disabled {
        border-color: transparent;
        color: #77766f;
    }

    /* Celular: margem lateral de 16px em tudo. Fica no fim do CSS para
       valer por cima das regras gerais acima */
    @media (max-width: 480px) {
        .status, .day, .back-nav, .cal {
            padding-left: 16px;
            padding-right: 16px;
        }
    }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
    // ===== Configuração (preencher com os dados do seu projeto Supabase) =====
    var SUPABASE_URL = "COLE_AQUI_A_URL_DO_PROJETO";
    var SUPABASE_ANON_KEY = "COLE_AQUI_A_ANON_KEY";
    // ==========================================================================

    var app = document.getElementById("app");

    // ---------- utilidades ----------

    function getToken() {
        var m = /[#&]t=([^&]+)/.exec(window.location.hash || "");
        return m ? decodeURIComponent(m[1]) : null;
    }

    function pad(n) {
        return n < 10 ? "0" + n : "" + n;
    }

    function parseDate(s) {
        var p = s.split("-");
        return new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10), 12, 0, 0);
    }

    function formatISO(d) {
        return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
    }

    function dayInfo(idx) {
        var d = parseDate(state.today);
        d.setDate(d.getDate() + idx);
        return { date: d, iso: formatISO(d), dow: d.getDay() };
    }

    function escapeHtml(s) {
        return String(s)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
    }

    function contains(arr, v) {
        if (!arr) {
            return false;
        }
        for (var i = 0; i < arr.length; i++) {
            if (arr[i] == v) {
                return true;
            }
        }
        return false;
    }

    function toggleIn(arr, v) {
        var out = [];
        var found = false;
        for (var i = 0; i < arr.length; i++) {
            if (arr[i] == v) {
                found = true;
            } else {
                out.push(arr[i]);
            }
        }
        if (!found) {
            out.push(v);
        }
        out.sort();
        return out;
    }

    function indexOfTask(id) {
        for (var i = 0; i < state.tasks.length; i++) {
            if (state.tasks[i].id === id) {
                return i;
            }
        }
        return -1;
    }

    function findTask(id) {
        var i = indexOfTask(id);
        return i >= 0 ? state.tasks[i] : null;
    }

    function isDone(t, iso) {
        return contains(t.done_dates, iso);
    }

    // Tarefas do dia, com as concluídas no fim da lista
    function tasksFor(idx) {
        var info = dayInfo(idx);
        var todo = [];
        var done = [];
        for (var i = 0; i < state.tasks.length; i++) {
            var t = state.tasks[i];
            var match = t.recurring_days ? contains(t.recurring_days, info.dow) : t.date === info.iso;
            if (!match) {
                continue;
            }
            if (isDone(t, info.iso)) {
                done.push(t);
            } else {
                todo.push(t);
            }
        }
        var timed = [];
        var untimed = [];
        for (var j = 0; j < todo.length; j++) {
            (todo[j].time ? timed : untimed).push(todo[j]);
        }
        // Sem horário: na ordem escolhida com ↑ ↓ (posição), depois por criação
        for (var u = 1; u < untimed.length; u++) {
            var item = untimed[u];
            var k = u - 1;
            while (k >= 0 && posOf(untimed[k]) > posOf(item)) {
                untimed[k + 1] = untimed[k];
                k--;
            }
            untimed[k + 1] = item;
        }
        // Ordenação por inserção: estável e sem depender do sort do navegador
        for (var a = 1; a < timed.length; a++) {
            var cur = timed[a];
            var b = a - 1;
            while (b >= 0 && timed[b].time > cur.time) {
                timed[b + 1] = timed[b];
                b--;
            }
            timed[b + 1] = cur;
        }
        return timed.concat(untimed).concat(done);
    }

    function posOf(t) {
        return typeof t.pos === "number" ? t.pos : 0;
    }

    // Tarefas sem horário e não feitas do dia (as que podem ser reordenadas)
    function movableFor(idx) {
        var list = tasksFor(idx);
        var iso = dayInfo(idx).iso;
        var out = [];
        for (var i = 0; i < list.length; i++) {
            if (!list[i].time && !isDone(list[i], iso)) {
                out.push(list[i]);
            }
        }
        return out;
    }

    function pendingCount(idx) {
        var list = tasksFor(idx);
        var iso = dayInfo(idx).iso;
        var n = 0;
        for (var i = 0; i < list.length; i++) {
            if (!isDone(list[i], iso)) {
                n++;
            }
        }
        return n;
    }

    function nowHHMM() {
        var n = new Date();
        return pad(n.getHours()) + ":" + pad(n.getMinutes());
    }

    // Só no dia de hoje, para tarefa não feita com horário já passado
    function isLate(t, idx) {
        return idx === 0 && !!t.time && t.time < nowHHMM() && !isDone(t, dayInfo(0).iso);
    }

    // Dias entre duas datas "AAAA-MM-DD"
    function daysBetween(a, b) {
        return Math.round((parseDate(b).getTime() - parseDate(a).getTime()) / 86400000);
    }

    // Ponto no calendário: só tarefas avulsas ainda não feitas
    function hasPendingOn(iso) {
        for (var i = 0; i < state.tasks.length; i++) {
            var t = state.tasks[i];
            if (!t.recurring_days && t.date === iso && !isDone(t, iso)) {
                return true;
            }
        }
        return false;
    }

    // [1, 3, 5] -> "segunda, quarta e sexta"
    function daysText(days) {
        if (days.length === 7) {
            return "todos os dias";
        }
        var names = [];
        for (var i = 0; i < days.length; i++) {
            names.push(DAY_FULL[days[i]]);
        }
        if (names.length === 1) {
            return names[0];
        }
        return names.slice(0, -1).join(", ") + " e " + names[names.length - 1];
    }

    // "30 de outubro de 2026 — 09:04" (hoje) / "— amanhã" / só a data
    function dateLine(d, idx) {
        var s = d.getDate() + " de " + MONTHS[d.getMonth()] + " de " + d.getFullYear();
        if (idx === 0) {
            var now = new Date();
            s += " — " + pad(now.getHours()) + ":" + pad(now.getMinutes());
        } else if (idx === 1) {
            s += " — amanhã";
        } else if (idx > 6) {
            s += " — em " + idx + " dias";
        }
        return s;
    }

    function closest(el, attr, root) {
        while (el && el !== root) {
            if (el.getAttribute && el.getAttribute(attr) !== null) {
                return el;
            }
            el = el.parentNode;
        }
        return null;
    }

    function focusById(id) {
        var el = id ? document.getElementById(id) : null;
        if (el && el.focus) {
            el.focus();
        }

    // ---------- backend ----------

    function rpc(name, params, cb) {
        if (DEMO) {
            demoRpc(name, params, cb);
            return;
        }
        var xhr = new XMLHttpRequest();
        xhr.open("POST", SUPABASE_URL + "/rest/v1/rpc/" + name, true);
        xhr.setRequestHeader("Content-Type", "application/json");
        xhr.setRequestHeader("apikey", SUPABASE_ANON_KEY);
        xhr.setRequestHeader("Authorization", "Bearer " + SUPABASE_ANON_KEY);
        xhr.onreadystatechange = function () {
            if (xhr.readyState !== 4) {
                return;
            }
            if (xhr.status >= 200 && xhr.status < 300) {
                var data = null;
                try {
                    data = xhr.responseText ? JSON.parse(xhr.responseText) : null;
                } catch (e) {
                    data = null;
                }
                cb(null, data);
            } else {
                cb("erro " + xhr.status);
            }
        };
        params.p_token = state.token;
        xhr.send(JSON.stringify(params));
    }

    // Modo demonstração: funciona sem Supabase, guardando no navegador
    var demoData = null;

    function demoLoad() {
        if (demoData) {
            return;
        }
        demoData = { nextId: 1, tasks: [] };
        try {
            var raw = window.localStorage.getItem("vecka-demo");
            if (raw) {
                demoData = JSON.parse(raw);
            }
        } catch (e) {
            demoData = { nextId: 1, tasks: [] };
        }
    }

    function demoSave() {
        try {
            window.localStorage.setItem("vecka-demo", JSON.stringify(demoData));
        } catch (e) {
            // sem localStorage: continua só em memória
        }
    }

    function demoRpc(name, p, cb) {
        demoLoad();
        var now = new Date();
        var today = formatISO(now);
        var i, j, t, kept, dates, visible;

        if (name === "kt_list") {
            kept = [];
            visible = [];
            for (i = 0; i < demoData.tasks.length; i++) {
                t = demoData.tasks[i];
                if (t.recurring_days) {
                    dates = [];
                    for (j = 0; j < t.done_dates.length; j++) {
                        if (t.done_dates[j] >= today) {
                            dates.push(t.done_dates[j]);
                        }
                    }
                    t.done_dates = dates;
                    kept.push(t);
                    visible.push(t);
                } else if (t.date >= today) {
                    kept.push(t);
                    visible.push(t);
                }
            }
            demoData.tasks = kept;
            demoSave();
            cb(null, { today: today, tasks: JSON.parse(JSON.stringify(visible)) });
            return;
        }
        if (name === "kt_add") {
            t = {
                id: demoData.nextId++,
                text: p.p_text,
                date: null,
                recurring_days: null,
                time: p.p_time || null,
                note: null,
                pos: new Date().getTime() / 1000,
                done_dates: []
            };
            if (p.p_days && p.p_days.length) {
                t.recurring_days = p.p_days.slice(0);
            } else {
                t.date = p.p_date;
            }
            demoData.tasks.push(t);
            demoSave();
            cb(null, t.id);
            return;
        }
        for (i = 0; i < demoData.tasks.length; i++) {
            t = demoData.tasks[i];
            if (t.id !== p.p_id) {
                continue;
            }
            if (name === "kt_toggle") {
                t.done_dates = toggleIn(t.done_dates, p.p_date);
            } else if (name === "kt_update") {
                t.text = p.p_text;
                t.time = p.p_time || null;
                t.note = p.p_note || null;
                if (p.p_days && p.p_days.length) {
                    t.recurring_days = p.p_days.slice(0);
                    t.date = null;
                } else {
                    if (!t.date) {
                        t.date = p.p_date;
                    }
                    t.recurring_days = null;
                }
            } else if (name === "kt_set_pos") {
                t.pos = p.p_pos;
            } else if (name === "kt_delete") {
                demoData.tasks.splice(i, 1);
            }
            break;
        }
        demoSave();
        cb(null, null);
    }

    function load(keepError) {
        if (state.today === null) {
            app.innerHTML = '<div class="msg" role="status">Carregando...</div>';
        }
        rpc("kt_list", {}, function (err, data) {
            if (err) {
                state.error = "Sem conexão com o servidor (" + err + "). Toque em atualizar.";
                if (state.today === null) {
                    app.innerHTML = '<div class="msg" role="alert">' + escapeHtml(state.error) + "</div>";
                } else {
                    updateStatus();
                }
                return;
            }
            if (!keepError) {
                state.error = null;
            }
            // Primeira carga ou o dia virou: volta para a lista, com hoje aberto
            if (state.today !== data.today) {
                state.openIdx = 0;
                state.listOpenIdx = 0;
                state.view = "list";
            }
            state.today = data.today;
            state.tasks = data.tasks || [];
            // Uma remoção esperando o "desfazer" não deve reaparecer
            if (state.pendingDelete) {
                var i = indexOfTask(state.pendingDelete.task.id);
                if (i >= 0) {
                    state.tasks.splice(i, 1);
                }
            }
            render();
        });
    }

    // Grava no servidor depois que a tela já mudou (atualização otimista).
    // Se falhar, avisa e recarrega a lista para voltar ao estado real.
    function sync(name, params, onOk) {
        rpc(name, params, function (err, data) {
            if (err) {
                state.error = "Não foi possível salvar a última alteração (" + err + "). A lista foi recarregada.";
                updateStatus();
                load(true);
                return;
            }
            if (state.error) {
                state.error = null;
                updateStatus();
            }
            if (onOk) {
                onOk(data);
            }
        });
    }

    // ---------- aparência: tema e tamanho da letra ----------

    function isDark() {
        return /(^|\s)dark(\s|$)/.test(document.documentElement.className);
    }

    function setTheme(theme, save) {
        document.documentElement.className = theme === "dark" ? "dark" : "";
        if (save) {
            try {
                window.localStorage.setItem("vecka-theme", theme);
            } catch (e) {
                // sem localStorage: vale até recarregar
            }
        }
    }

    function initTheme() {
        var saved = null;
        try {
            saved = window.localStorage.getItem("vecka-theme");
        } catch (e) {
            saved = null;
        }
        if (saved) {
            setTheme(saved, false);
            return;
        }
        var prefersDark = window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
        setTheme(prefersDark ? "dark" : "light", false);
    }

    function themeLabel() {
        return isDark() ? "Mudar para tema claro" : "Mudar para tema escuro";
    }

    function setFontStep(step, save) {
        var max = FONT_STEPS.length - 1;
        if (step < 0) {
            step = 0;
        }
        if (step > max) {
            step = max;
        }
        state.fontStep = step;
        app.style.zoom = FONT_STEPS[step];
        var down = document.getElementById("font-down");
        var up = document.getElementById("font-up");
        if (down) {
            down.disabled = step === 0;
        }
        if (up) {
            up.disabled = step === max;
        }
        if (save) {
            try {
                window.localStorage.setItem("vecka-font-step", String(step));
            } catch (e) {
                // sem localStorage: vale até recarregar
            }
        }
    }

    function savedFontStep() {
        try {
            var v = parseInt(window.localStorage.getItem("vecka-font-step"), 10);
            return isNaN(v) ? 1 : v;
        } catch (e) {
            return 1;
        }
    }

    // ---------- interface ----------

    function statusHtml() {
        if (state.error) {
            return escapeHtml(state.error);
        }
        return DEMO ? "Modo demonstração (sem servidor)" : "";
    }

    function updateStatus() {
        var el = document.getElementById("status");
        if (el) {
            el.className = "status" + (state.error ? " error" : "");
            el.innerHTML = state.error ? "<span>" + statusHtml() + "</span>" : statusHtml();
        }
    }

    function weekdayButtons(selected, action, labelId) {
        var h = '<div class="weekdays" role="group" aria-labelledby="' + labelId + '">';
        for (var d = 0; d < 7; d++) {
            var on = contains(selected, d);
            h += '<button type="button" class="wd' + (on ? " on" : "") + '" id="' + action + "-" + d +
                '" data-action="' + action + '" data-day="' + d + '" aria-pressed="' + (on ? "true" : "false") +
                '" aria-label="' + DAY_FULL[d] + '">' + DAY_SHORT[d] + "</button>";
        }
        return h + "</div>";
    }

    function pickedTime() {
        if (!state.timeOpen || state.pickH === null) {
            return null;
        }
        return pad(state.pickH) + ":" + pad(state.pickM === null ? 0 : state.pickM);
    }

    function setPickFrom(time) {
        if (time) {
            state.pickH = parseInt(time.substr(0, 2), 10);
            state.pickM = parseInt(time.substr(3, 2), 10);
            state.pickNight = state.pickH < 6;
            state.pickFine = state.pickM % 15 !== 0;
        } else {
            state.pickH = null;
            state.pickM = null;
            state.pickNight = false;
            state.pickFine = false;
        }
    }

    function timeToggle() {
        return '<button type="button" class="btn alt' + (state.timeOpen ? " on" : "") + '" id="time-btn"' +
            ' data-action="toggle-time" aria-pressed="' + (state.timeOpen ? "true" : "false") + '">Horário</button>';
    }

    function pickerTable(values, selected, action, prefix, perRow, unit) {
        var h = '<table class="tp-grid"><tr>';
        for (var i = 0; i < values.length; i++) {
            if (i > 0 && i % perRow === 0) {
                h += "</tr><tr>";
            }
            var v = values[i];
            var on = selected === v;
            h += '<td><button type="button" class="tp-btn' + (on ? " on" : "") + '" id="' + prefix + v +
                '" data-action="' + action + '" data-v="' + v + '" aria-pressed="' + (on ? "true" : "false") +
                '" aria-label="' + v + " " + unit + '">' + pad(v) + "</button></td>";
        }
        return h + "</tr></table>";
    }

    // Grade de toques: hora (06–23, com 00–05 em "madrugada") e minutos (00/15/30/45)
    function timePicker() {
        var hours = [];
        for (var hh = state.pickNight ? 0 : 6; hh < 24; hh++) {
            hours.push(hh);
        }
        var mins = [0, 15, 30, 45];
        if (state.pickFine) {
            mins = [];
            for (var mm = 0; mm < 60; mm += 5) {
                mins.push(mm);
            }
        }
        // Um horário salvo fora da grade (ex.: 12:10) continua escolhível
        if (state.pickM !== null && !contains(mins, state.pickM)) {
            mins.push(state.pickM);
            mins.sort(function (x, y) {
                return x - y;
            });
        }
        var time = pickedTime();
        var h = '<div class="tp" role="group" aria-labelledby="tp-h-label">' +
            '<div class="hint" id="tp-h-label">Hora</div>' +
            pickerTable(hours, state.pickH, "pick-h", "tph-", 6, "horas");
        if (!state.pickNight) {
            h += '<button type="button" class="link tp-night" id="tp-night" data-action="pick-night">madrugada (00 a 05)</button>';
        }
        h += "</div>" +
            '<div class="tp" role="group" aria-labelledby="tp-m-label">' +
            '<div class="hint" id="tp-m-label">Minutos</div>' +
            pickerTable(mins, state.pickM, "pick-m", "tpm-", state.pickFine ? 6 : mins.length, "minutos") +
            (state.pickFine ? "" :
                '<button type="button" class="link tp-night" id="tp-fine" data-action="pick-fine">mais minutos (de 5 em 5)</button>') +
            "</div>" +
            '<div class="tp-result" aria-live="polite">' +
            (time ? "Horário: <strong>" + time + "</strong> " +
                '<button type="button" class="link" id="tp-clear" data-action="pick-clear">limpar</button>' :
                "Escolha a hora") +
            "</div>";
        return h;
    }

    function renderTask(t, idx) {
        if (state.editingId === t.id) {
            return '<form class="edit" data-form="edit" data-id="' + t.id + '">' +
                '<label class="sr" for="edit-text">Texto da tarefa</label>' +
                '<input type="text" id="edit-text" value="' + escapeHtml(t.text) + '" autocomplete="off">' +
                '<label class="hint" for="edit-note">Nota (opcional; aparece ao tocar no …)</label>' +
                '<textarea id="edit-note" rows="3" maxlength="1000">' + escapeHtml(t.note || "") + "</textarea>" +
                '<div>' + timeToggle() + "</div>" +
                (state.timeOpen ? timePicker() : "") +
                '<div class="hint" id="edit-hint">Repetir nos dias (nenhum = só neste dia):</div>' +
                weekdayButtons(state.editDays, "edit-day", "edit-hint") +
                '<button type="submit" class="btn">Salvar</button>' +
                '<button type="button" class="btn alt" data-action="cancel-edit">Cancelar</button>' +
                "</form>";
        }
        var iso = dayInfo(idx).iso;
        var done = isDone(t, iso);
        var label = escapeHtml(t.text);
        var showActions = state.actionsId === t.id;
        var h = '<div class="task' + (done ? " done" : "") + (t.id < 0 ? " temp" : "") + '" id="task-' + t.id + '">' +
            '<div class="task-cell">' +
            '<button type="button" class="task-main" id="tg-' + t.id + '" role="checkbox" aria-checked="' +
            (done ? "true" : "false") + '" data-action="toggle" data-id="' + t.id + '" data-idx="' + idx + '">' +
            '<span class="box" aria-hidden="true"></span>' +
            '<span class="label">' + label + "</span>";
        if (t.note) {
            h += '<span class="note-ic" title="Tem nota">' + ICON_NOTE + '</span><span class="sr">, tem nota</span>';
        }
        var late = isLate(t, idx);
        if (t.time) {
            h += '<span class="sr">, às ' + t.time + (late ? ", atrasada" : "") + "</span>";
        }
        if (t.recurring_days) {
            var rep = "Repete " + daysText(t.recurring_days);
            h += '<span class="rec" aria-hidden="true" title="' + rep + '">↻</span>' +
                '<span class="sr">, ' + rep.toLowerCase() + "</span>";
        }
        h += "</button></div>";
        if (t.time) {
            h += '<div class="task-time' + (late ? " late" : "") + '" aria-hidden="true"><span>' + t.time + "</span></div>";
        }
        h += '<div class="task-actions">' +
            '<button type="button" class="small more" id="mo-' + t.id + '" data-action="more" data-id="' + t.id +
            '" aria-expanded="' + (showActions ? "true" : "false") + '" aria-controls="panel-' + t.id +
            '" aria-label="Mais ações para ' + label + '">…</button>' +
            "</div></div>";
        if (showActions) {
            h += renderPanel(t, idx, label);
        }
        return h;
    }

    // Painel do "…": nota (se houver), editar, subir/descer (sem horário) e remover
    function renderPanel(t, idx, label) {
        var movable = movableFor(idx);
        var pos = -1;
        for (var i = 0; i < movable.length; i++) {
            if (movable[i].id === t.id) {
                pos = i;
            }
        }
        var h = '<div class="task-panel" id="panel-' + t.id + '">';
        if (t.note) {
            h += '<p class="task-note">' + escapeHtml(t.note) + "</p>";
        }
        h += '<button type="button" class="btn alt sm" id="ed-' + t.id + '" data-action="edit" data-id="' + t.id +
            '" aria-label="Editar ' + label + '">Editar</button>';
        if (pos > 0) {
            h += '<button type="button" class="btn alt sm sq" id="up-' + t.id + '" data-action="move" data-dir="-1"' +
                ' data-id="' + t.id + '" data-idx="' + idx + '" aria-label="Subir ' + label + '" title="Subir">↑</button>';
        }
        if (pos >= 0 && pos < movable.length - 1) {
            h += '<button type="button" class="btn alt sm sq" id="dn-' + t.id + '" data-action="move" data-dir="1"' +
                ' data-id="' + t.id + '" data-idx="' + idx + '" aria-label="Descer ' + label + '" title="Descer">↓</button>';
        }
        h += '<button type="button" class="btn alt sm" id="rm-' + t.id + '" data-action="delete" data-id="' + t.id +
            '" aria-label="Remover ' + label + '">Remover</button>' +
            "</div>";
        return h;
    }

    function renderDay(idx) {
        var info = dayInfo(idx);
        var open = idx === state.openIdx;
        var name = DAY_NAMES[info.dow];
        var h = '<section class="day' + (open ? " open" : "") + '" id="day-' + idx + '" aria-labelledby="dh-' + idx + '">';

        if (!open) {
            var pending = pendingCount(idx);
            h += '<h2 class="day-title">' +
                '<button type="button" class="day-head" id="dh-' + idx + '" data-action="open" data-idx="' + idx +
                '" aria-expanded="false">' + name +
                (idx === 0 ? '<span class="tag">hoje</span>' :
                    '<span class="dd">' + pad(info.date.getDate()) + "/" + pad(info.date.getMonth() + 1) + "</span>") +
                (pending ? '<span class="count">' + pending + '<span class="sr"> ' +
                    (pending === 1 ? "tarefa pendente" : "tarefas pendentes") + "</span></span>" : "") +
                "</button></h2></section>";
            return h;
        }

        var list = tasksFor(idx);
        h += '<h2 class="day-head" id="dh-' + idx + '" tabindex="-1">' + name + "</h2>" +
            '<div class="date" id="date-line">' + dateLine(info.date, idx) + "</div>";
        if (!list.length) {
            h += '<p class="empty">Nada por aqui.</p>';
        }
        for (var i = 0; i < list.length; i++) {
            h += renderTask(list[i], idx);
        }
        h += '<form class="add" data-form="add">' +
            '<label class="sr" for="add-text">Nova tarefa para ' + DAY_FULL[info.dow] + "</label>" +
            '<input type="text" id="add-text" placeholder="Adicionar tarefa..." autocomplete="off">';
        if (state.timeOpen && state.editingId === null) {
            h += timePicker();
        }
        if (state.addRepeat) {
            h += '<div class="hint" id="add-hint">Repetir toda semana nos dias:</div>' +
                weekdayButtons(state.addDays, "add-day", "add-hint");
        }
        h += '<button type="submit" class="btn">Adicionar</button>' +
            (state.editingId === null ? timeToggle() : "") +
            '<button type="button" class="btn alt' + (state.addRepeat ? " on" : "") + '" id="repeat-btn"' +
            ' data-action="add-repeat" aria-pressed="' + (state.addRepeat ? "true" : "false") + '">↻ Repetir</button>' +
            "</form></section>";
        return h;
    }

    function renderCalBand() {
        return '<section class="day cal-band">' +
            '<h2 class="day-title"><button type="button" class="day-head" id="cal-open" data-action="calendar">' +
            "CALENDÁRIO</button></h2></section>";
    }

    function renderCalendar() {
        var y = state.calY;
        var m = state.calM;
        var todayDate = parseDate(state.today);
        var atCurrent = y === todayDate.getFullYear() && m === todayDate.getMonth();
        var first = new Date(y, m, 1, 12, 0, 0);
        var daysInMonth = new Date(y, m + 1, 0, 12, 0, 0).getDate();
        var h = '<div class="back-nav"><button type="button" class="link" id="back-btn" data-action="back-list">voltar</button></div>' +
            '<section class="cal" id="cal" aria-labelledby="cal-title"><div class="cal-center">' +
            '<table class="cal-grid"><thead><tr>';
        for (var w = 0; w < 7; w++) {
            h += '<th scope="col"><abbr title="' + DAY_FULL[w] + '">' + DAY_SHORT[w] + "</abbr></th>";
        }
        h += "</tr></thead><tbody><tr>";
        var col = first.getDay();
        for (var e = 0; e < col; e++) {
            h += "<td></td>";
        }
        for (var day = 1; day <= daysInMonth; day++) {
            var d = new Date(y, m, day, 12, 0, 0);
            var iso = formatISO(d);
            var past = iso < state.today;
            var isToday = iso === state.today;
            var dot = !past && hasPendingOn(iso);
            var label = day + " de " + MONTHS[m] + ", " + DAY_FULL[d.getDay()] +
                (isToday ? ", hoje" : "") + (dot ? ", com tarefas" : "");
            h += '<td><button type="button" class="cal-day' + (isToday ? " today" : "") + '" id="cd-' + iso +
                '" data-action="cal-pick" data-date="' + iso + '" aria-label="' + label + '"' +
                (past ? " disabled" : "") + ">" + day +
                (dot ? '<span class="dot" aria-hidden="true"></span>' : "") + "</button></td>";
            col++;
            if (col === 7 && day < daysInMonth) {
                h += "</tr><tr>";
                col = 0;
            }
        }
        var rows = Math.ceil((first.getDay() + daysInMonth) / 7);
        while (col > 0 && col < 7) {
            h += "<td></td>";
            col++;
        }
        for (; rows < 6; rows++) {
            h += "</tr><tr>";
            for (var c = 0; c < 7; c++) {
                h += '<td><span class="cal-pad"></span></td>';
            }
        }
        // Navegação embaixo da grade, perto do polegar
        h += "</tr></tbody></table></div></section>" +
            '<div class="cal-bar" id="cal-bar"><div class="cal-head">' +
            '<span class="cal-cell"><button type="button" class="cal-arrow" id="cal-prev" data-action="cal-prev"' +
            ' aria-label="Mês anterior"' + (atCurrent ? " disabled" : "") + ">‹</button></span>" +
            '<h2 class="cal-title" id="cal-title" tabindex="-1" aria-live="polite">' + MONTHS[m].toUpperCase() + " " + y + "</h2>" +
            '<span class="cal-cell right"><button type="button" class="cal-arrow" id="cal-next" data-action="cal-next"' +
            ' aria-label="Próximo mês">›</button></span>' +
            "</div></div>";
        return h;
    }

    // O calendário ocupa a altura que sobra na tela, para ficar no meio dela
    function fitCalendar() {
        var cal = document.getElementById("cal");
        if (!cal) {
            return;
        }
        cal.style.height = "";
        var zoom = FONT_STEPS[state.fontStep];
        var top = cal.getBoundingClientRect().top + (window.pageYOffset || 0);
        var bar = document.getElementById("cal-bar");
        var barHeight = bar ? bar.offsetHeight : 0;
        var free = window.innerHeight / zoom - top / zoom - barHeight;
        if (free > cal.offsetHeight) {
            cal.style.height = free + "px";
        }
    }

    function render() {
        if (!state.token) {
            app.innerHTML = '<div class="msg" role="alert">Link inválido.</div>';
            return;
        }
        if (state.today === null) {
            return;
        }
        var focusId = document.activeElement ? document.activeElement.id : null;
        var h = '<header class="topbar">' +
            '<div class="brand">' + WORDMARK + "</div>" +
            '<div class="top-actions">' +
            (IS_KINDLE ? '<button type="button" class="icon-btn" id="clean-btn" data-action="clean"' +
                ' aria-label="Limpar a tela" title="Limpar a tela">' + ICON_CLEAN + "</button>" : "") +
            '<button type="button" class="icon-btn a-sm" id="font-down" data-action="font-down"' +
            ' aria-label="Diminuir letra" title="Diminuir letra">A</button>' +
            '<button type="button" class="icon-btn a-lg" id="font-up" data-action="font-up"' +
            ' aria-label="Aumentar letra" title="Aumentar letra">A</button>' +
            '<button type="button" class="icon-btn" id="theme-btn" data-action="theme" aria-label="' + themeLabel() +
            '" title="' + themeLabel() + '">' + ICON_THEME + "</button>" +
            "</div></header>" +
            '<div id="status" class="status' + (state.error ? " error" : "") + '" role="status" aria-live="polite">' +
            (state.error ? "<span>" + statusHtml() + "</span>" : statusHtml()) + "</div>" +
            "";
        if (state.view === "calendar") {
            h += "<main>" + renderCalendar() + "</main>";
        } else if (state.view === "day") {
            h += '<div class="back-nav"><button type="button" class="link" id="back-btn" data-action="back-cal">calendário</button></div>' +
                "<main>" + renderDay(state.openIdx) + "</main>";
        } else {
            h += "<main>";
            for (var i = 0; i < 7; i++) {
                h += renderDay(i);
            }
            h += renderCalBand() + "</main>";
        }
        app.innerHTML = h;
        setFontStep(state.fontStep, false);
        fitCalendar();
        focusById(focusId);
    }

    // Redesenha só um dia: no e-ink, mudar menos coisas evita a "piscada" da tela
    function renderDayOnly(idx) {
        var el = document.getElementById("day-" + idx);
        if (!el) {
            render();
            return;
        }
        var focusId = document.activeElement ? document.activeElement.id : null;
        el.outerHTML = renderDay(idx);
        focusById(focusId);
    }

    function rerenderOpen() {
        renderDayOnly(state.openIdx);
    }

    // Mantém o texto digitado quando a tela é redesenhada
    function keepInput(inputId, fn) {
        var ids = [inputId, inputId.replace("-text", "-note")];
        var values = [];
        var i, input;
        for (i = 0; i < ids.length; i++) {
            input = document.getElementById(ids[i]);
            values.push(input ? input.value : null);
        }
        fn();
        for (i = 0; i < ids.length; i++) {
            input = document.getElementById(ids[i]);
            if (input && values[i] !== null) {
                input.value = values[i];
            }
        }
    }

    // Campo de texto do formulário que está aberto (edição ou adicionar)
    function formInputId() {
        return state.editingId !== null ? "edit-text" : "add-text";
    }

    // ---------- ações ----------

    // Abre o dia no próprio lugar: o nome tocado fica parado sob o dedo
    function openDay(idx, btn) {
        var before = btn.getBoundingClientRect().top;
        var old = state.openIdx;
        state.openIdx = idx;
        state.editingId = null;
        state.actionsId = null;
        state.addRepeat = false;
        state.timeOpen = false;
        state.addDays = [];
        renderDayOnly(old);
        renderDayOnly(idx);
        var head = document.getElementById("dh-" + idx);
        if (head) {
            window.scrollBy(0, head.getBoundingClientRect().top - before);
            head.focus();
        }
    }

    // Troca de tela (lista, mês ou dia distante) começando do topo
    function showView(view) {
        state.view = view;
        state.editingId = null;
        state.actionsId = null;
        state.addRepeat = false;
        state.timeOpen = false;
        state.addDays = [];
        render();
        window.scrollTo(0, 0);
    }

    function openCalendar(y, m) {
        if (state.view === "list") {
            state.listOpenIdx = state.openIdx;
        }
        state.calY = y;
        state.calM = m;
        showView("calendar");
    }

    function changeMonth(delta) {
        state.calM += delta;
        if (state.calM < 0) {
            state.calM = 11;
            state.calY--;
        }
        if (state.calM > 11) {
            state.calM = 0;
            state.calY++;
        }
        render();
        var prev = document.getElementById("cal-prev");
        if (prev && prev.disabled) {
            focusById("cal-title");
        }
    }

    // Dentro dos 7 dias: abre o dia na lista. Mais longe: tela própria do dia.
    function pickDate(iso) {
        var idx = daysBetween(state.today, iso);
        if (idx < 0) {
            return;
        }
        if (idx <= 6) {
            state.openIdx = idx;
            state.listOpenIdx = idx;
            showView("list");
            var sec = document.getElementById("day-" + idx);
            if (sec && idx > 0 && sec.scrollIntoView) {
                sec.scrollIntoView(true);
            }
            focusById("dh-" + idx);
            return;
        }
        state.openIdx = idx;
        showView("day");
        focusById("dh-" + idx);
    }

    function backToList() {
        state.openIdx = state.listOpenIdx;
        showView("list");
        focusById("cal-open");
    }

    function backToCalendar() {
        var info = dayInfo(state.openIdx);
        openCalendar(info.date.getFullYear(), info.date.getMonth());
        focusById("cd-" + info.iso);
    }

    // Pisca a tela em preto e depois branco: força o e-ink a redesenhar tudo
    function cleanScreen() {
        var f = document.createElement("div");
        f.className = "flash";
        f.style.background = "#000";
        document.body.appendChild(f);
        setTimeout(function () {
            f.style.background = "#fff";
            setTimeout(function () {
                document.body.removeChild(f);
            }, 250);
        }, 250);
    }

    // Troca a posição com a vizinha de cima (dir -1) ou de baixo (dir 1)
    function moveTask(id, idx, dir) {
        var list = movableFor(idx);
        var i = -1;
        for (var k = 0; k < list.length; k++) {
            if (list[k].id === id) {
                i = k;
            }
        }
        var j = i + dir;
        if (i < 0 || j < 0 || j >= list.length) {
            return;
        }
        var a = list[i];
        var b = list[j];
        var pa = posOf(a);
        var pb = posOf(b);
        if (pa === pb) {
            pb = pa + dir;
        }
        a.pos = pb;
        b.pos = pa;
        if (a.recurring_days || b.recurring_days) {
            render();
        } else {
            rerenderOpen();
        }
        // Mantém o foco no mesmo botão; se ele sumiu (chegou ao topo/fim), vai para o outro
        var same = (dir < 0 ? "up-" : "dn-") + id;
        focusById(document.getElementById(same) ? same : (dir < 0 ? "dn-" : "up-") + id);
        sync("kt_set_pos", { p_id: a.id, p_pos: a.pos });
        sync("kt_set_pos", { p_id: b.id, p_pos: b.pos });
    }

    function toggleTask(id, idx) {
        var t = findTask(id);
        if (!t || id < 0) {
            return;
        }
        var iso = dayInfo(idx).iso;
        t.done_dates = toggleIn(t.done_dates || [], iso);
        renderDayOnly(idx);
        sync("kt_toggle", { p_id: id, p_date: iso });
    }

    // Troca o id provisório pelo id do servidor sem redesenhar a tela
    function replaceTempId(task, newId) {
        var oldId = task.id;
        task.id = newId;
        var row = document.getElementById("task-" + oldId);
        if (!row) {
            return;
        }
        row.id = "task-" + newId;
        row.className = row.className.replace(" temp", "");
        var els = row.getElementsByTagName("*");
        for (var i = 0; i < els.length; i++) {
            if (els[i].getAttribute("data-id") === String(oldId)) {
                els[i].setAttribute("data-id", String(newId));
            }
            if (els[i].id) {
                els[i].id = els[i].id.split("-")[0] + "-" + newId;
            }
        }
    }

    function addTask(text, time) {
        var info = dayInfo(state.openIdx);
        var days = state.addRepeat && state.addDays.length ? state.addDays.slice(0) : null;
        var task = {
            id: -(++state.tempSeq),
            text: text,
            date: days ? null : info.iso,
            recurring_days: days,
            time: time,
            note: null,
            pos: new Date().getTime() / 1000,
            done_dates: []
        };
        state.tasks.push(task);
        state.addRepeat = false;
        state.timeOpen = false;
        state.addDays = [];
        if (days) {
            render();
        } else {
            rerenderOpen();
        }
        // Continua no campo para adicionar a próxima tarefa
        focusById("add-text");
        sync("kt_add", { p_text: text, p_date: info.iso, p_days: days, p_time: time }, function (newId) {
            if (typeof newId === "number") {
                replaceTempId(task, newId);
            }
        });
    }

    function saveEdit(id, text, time, note) {
        var t = findTask(id);
        if (!t) {
            return;
        }
        var info = dayInfo(state.openIdx);
        var days = state.editDays.length ? state.editDays.slice(0) : null;
        var wasRecurring = !!t.recurring_days;
        t.text = text;
        t.time = time;
        t.note = note;
        state.timeOpen = false;
        if (days) {
            t.recurring_days = days;
            t.date = null;
        } else {
            if (!t.date) {
                t.date = info.iso;
            }
            t.recurring_days = null;
        }
        state.editingId = null;
        if (days || wasRecurring) {
            render();
        } else {
            rerenderOpen();
        }
        focusById("tg-" + id);
        sync("kt_update", { p_id: id, p_text: text, p_date: info.iso, p_days: days, p_time: time, p_note: note });
    }

    function cancelEdit() {
        var id = state.editingId;
        state.editingId = null;
        state.timeOpen = false;
        rerenderOpen();
        focusById("mo-" + id);
    }

    function showToast(text) {
        toast.innerHTML = '<div class="toast-inner">' +
            '<span class="toast-text">' + escapeHtml(text) + "</span>" +
            '<span class="toast-act"><button type="button" class="toast-btn" id="undo-btn" data-action="undo">desfazer</button></span>' +
            "</div>";
        toast.className = "toast show";
    }

    function hideToast() {
        toast.className = "toast";
        toast.innerHTML = "";
    }

    // Remove na hora e dá alguns segundos para desfazer antes de apagar no servidor
    function deleteTask(id) {
        if (id < 0) {
            return;
        }
        if (state.pendingDelete) {
            commitDelete();
        }
        var i = indexOfTask(id);
        if (i < 0) {
            return;
        }
        var t = state.tasks[i];
        state.tasks.splice(i, 1);
        state.actionsId = null;
        state.pendingDelete = { task: t, index: i, timer: setTimeout(commitDelete, UNDO_MS) };
        if (t.recurring_days) {
            render();
        } else {
            rerenderOpen();
        }
        showToast("“" + t.text + "” removida.");
    }

    function commitDelete() {
        var pd = state.pendingDelete;
        if (!pd) {
            return;
        }
        clearTimeout(pd.timer);
        state.pendingDelete = null;
        hideToast();
        sync("kt_delete", { p_id: pd.task.id });
    }

    function undoDelete() {
        var pd = state.pendingDelete;
        if (!pd) {
            return;
        }
        clearTimeout(pd.timer);
        state.pendingDelete = null;
        hideToast();
        state.tasks.splice(Math.min(pd.index, state.tasks.length), 0, pd.task);
        if (pd.task.recurring_days) {
            render();
        } else {
            rerenderOpen();
        }
        focusById("tg-" + pd.task.id);
    }

    // ---------- eventos ----------

    app.onclick = function (e) {
        e = e || window.event;
        var el = closest(e.target || e.srcElement, "data-action", app);
        if (!el || el.disabled) {
            return;
        }
        var action = el.getAttribute("data-action");
        var id = parseInt(el.getAttribute("data-id"), 10);
        var idx = parseInt(el.getAttribute("data-idx"), 10);
        var day = parseInt(el.getAttribute("data-day"), 10);
        var t;

        if (action === "calendar") {
            var td = parseDate(state.today);
            openCalendar(td.getFullYear(), td.getMonth());
            focusById("cal-title");
        } else if (action === "cal-prev" || action === "cal-next") {
            changeMonth(action === "cal-next" ? 1 : -1);
        } else if (action === "cal-pick") {
            pickDate(el.getAttribute("data-date"));
        } else if (action === "back-list") {
            backToList();
        } else if (action === "back-cal") {
            backToCalendar();
        } else if (action === "theme") {
            setTheme(isDark() ? "light" : "dark", true);
            el.setAttribute("aria-label", themeLabel());
            el.setAttribute("title", themeLabel());
        } else if (action === "clean") {
            cleanScreen();
        } else if (action === "move") {
            moveTask(id, idx, parseInt(el.getAttribute("data-dir"), 10));
        } else if (action === "font-down" || action === "font-up") {
            setFontStep(state.fontStep + (action === "font-up" ? 1 : -1), true);
        } else if (action === "open") {
            openDay(idx, el);
        } else if (action === "toggle") {
            toggleTask(id, idx);
        } else if (action === "more") {
            if (id < 0) {
                return;
            }
            state.actionsId = state.actionsId === id ? null : id;
            rerenderOpen();
        } else if (action === "edit") {
            t = findTask(id);
            if (!t) {
                return;
            }
            state.editingId = id;
            state.actionsId = null;
            state.timeOpen = !!t.time;
            setPickFrom(t.time);
            state.editDays = t.recurring_days ? t.recurring_days.slice(0) : [];
            rerenderOpen();
            focusById("edit-text");
        } else if (action === "cancel-edit") {
            cancelEdit();
        } else if (action === "edit-day") {
            state.editDays = toggleIn(state.editDays, day);
            keepInput("edit-text", rerenderOpen);
        } else if (action === "delete") {
            deleteTask(id);
        } else if (action === "toggle-time") {
            state.timeOpen = !state.timeOpen;
            setPickFrom(null);
            keepInput(formInputId(), rerenderOpen);
        } else if (action === "pick-h") {
            state.pickH = parseInt(el.getAttribute("data-v"), 10);
            if (state.pickM === null) {
                state.pickM = 0;
            }
            keepInput(formInputId(), rerenderOpen);
        } else if (action === "pick-m") {
            state.pickM = parseInt(el.getAttribute("data-v"), 10);
            keepInput(formInputId(), rerenderOpen);
        } else if (action === "pick-night") {
            state.pickNight = true;
            keepInput(formInputId(), rerenderOpen);
            focusById("tph-0");
        } else if (action === "pick-fine") {
            state.pickFine = true;
            keepInput(formInputId(), rerenderOpen);
            focusById("tpm-5");
        } else if (action === "pick-clear") {
            setPickFrom(null);
            keepInput(formInputId(), rerenderOpen);
            focusById("time-btn");
        } else if (action === "add-repeat") {
            state.addRepeat = !state.addRepeat;
            state.addDays = state.addRepeat ? [dayInfo(state.openIdx).dow] : [];
            keepInput("add-text", rerenderOpen);
        } else if (action === "add-day") {
            state.addDays = toggleIn(state.addDays, day);
            keepInput("add-text", rerenderOpen);
        }
    };

    toast.onclick = function (e) {
        e = e || window.event;
        var el = closest(e.target || e.srcElement, "data-action", toast);
        if (el && el.getAttribute("data-action") === "undo") {
            undoDelete();
        }
    };

    app.onsubmit = function (e) {
        e = e || window.event;
        if (e.preventDefault) {
            e.preventDefault();
        }
        var form = e.target || e.srcElement;
        var kind = form.getAttribute("data-form");
        var input = document.getElementById(kind === "add" ? "add-text" : "edit-text");
        var text = input ? input.value.replace(/^\s+|\s+$/g, "") : "";
        if (!text) {
            return false;
        }
        var time = pickedTime();
        if (kind === "add") {
            addTask(text, time);
        } else if (kind === "edit") {
            var noteEl = document.getElementById("edit-note");
            var note = noteEl ? noteEl.value.replace(/^\s+|\s+$/g, "") : "";
            saveEdit(parseInt(form.getAttribute("data-id"), 10), text, time, note || null);
        }
        return false;
    };

    // Esc fecha a edição, o menu de ações ou volta uma tela (no computador)
    document.onkeydown = function (e) {
        e = e || window.event;
        var isEsc = e.key === "Escape" || e.key === "Esc" || e.keyCode === 27;
        if (!isEsc) {
            return;
        }
        if (state.editingId !== null) {
            cancelEdit();
        } else if (state.actionsId !== null) {
            var id = state.actionsId;
            state.actionsId = null;
            rerenderOpen();
            focusById("mo-" + id);
        } else if (state.view === "day") {
            backToCalendar();
        } else if (state.view === "calendar") {
            backToList();
        }
    };

    // A cada minuto: atualiza a hora e, se o dia virou, recarrega a lista
    var lastLocalDay = formatISO(new Date());
    setInterval(function () {
        if (state.today === null) {
            return;
        }
        var nowDay = formatISO(new Date());
        if (nowDay !== lastLocalDay) {
            lastLocalDay = nowDay;
            load();
            return;
        }
        var el = document.getElementById("date-line");
        if (el) {
            el.innerHTML = dateLine(dayInfo(state.openIdx).date, state.openIdx);
        }
        // Pinta de vermelho só os horários que acabaram de passar (sem redesenhar a lista)
        if (state.view === "list" && state.openIdx === 0) {
            for (var i = 0; i < state.tasks.length; i++) {
                var t = state.tasks[i];
                var cell = document.getElementById("task-" + t.id);
                var timeEl = cell ? cell.getElementsByTagName("div") : [];
                for (var j = 0; j < timeEl.length; j++) {
                    if (/task-time/.test(timeEl[j].className)) {
                        timeEl[j].className = "task-time" + (isLate(t, 0) ? " late" : "");
                    }
                }
            }
        }
    }, 60000);

    window.onresize = fitCalendar;

    // Sem botão "atualizar": a lista recarrega ao voltar para o app e a cada
    // 5 minutos, mas nunca no meio de uma edição ou digitação
    function canAutoLoad() {
        var a = document.activeElement;
        var typing = a && a.tagName === "INPUT" && a.value;
        return state.today !== null && state.editingId === null && !typing && !state.pendingDelete;
    }

    document.addEventListener("visibilitychange", function () {
        if (!document.hidden && canAutoLoad()) {
            load();
        }
    }, false);

    setInterval(function () {
        if (!document.hidden && canAutoLoad()) {
            load();
        }
    }, 300000);

    initTheme();
    setFontStep(savedFontStep(), false);
    state.token = DEMO ? (getToken() || "demo") : getToken();
    if (state.token) {
        load();
    } else {
        render();
    }
</script>
</body>
</html>
